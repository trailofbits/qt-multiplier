name: Posix

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string

      build_type:
        required: true
        type: string

      multiplier_release:
        required: true
        type: string

      llvm_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.platform }}

    env:
      CACHE_KEY: platform-${{ inputs.platform }}_type-${{ inputs.build_type }}-${{ inputs.multiplier_release }}
      INSTALL_DIR: ${{ github.workspace }}/qt-multiplier-install

    steps:
      - name: Clone the source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive libraries/doctest/src
          git submodule update --init --recursive libraries/phantomstyle/src
          git submodule update --init --recursive libraries/xxhash/src
          git submodule update --init --recursive libraries/qt-advanced-docking-system/src

      - name: Set up ccache
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache_${{ env.CACHE_KEY }}-${{ github.sha }}
          restore-keys: ccache_${{ env.CACHE_KEY }}

      - name: Install Clang and LLVM
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${{ inputs.llvm_version }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

          sudo apt-get update

          sudo apt-get install -y \
            clang-${{ inputs.llvm_version }} \
            lld-${{ inputs.llvm_version }}

          echo "CC=clang-${{ inputs.llvm_version }}" >> $GITHUB_ENV
          echo "CXX=clang++-${{ inputs.llvm_version }}" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
            ccache \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-private-dev \
            libqt6core5compat6-dev \
            libgl1-mesa-dev \
            libglvnd-dev \
            libxkbcommon-dev \
            dpkg-dev

      - name: Download multiplier release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          folder_name="multiplier-${{ inputs.multiplier_release }}"
          archive_name="${folder_name}.tar.xz"

          gh release download "${{ inputs.multiplier_release }}" \
            --repo trailofbits/multiplier

          mkdir "${folder_name}"
          tar -xf "${archive_name}" --directory "${folder_name}"
          rm "${archive_name}"

          echo "MULTIPLIER_INSTALL_DIRECTORY=$(pwd)/${folder_name}" >> $GITHUB_ENV

      - name: Configure qt-multiplier
        run: |
          cmake \
            -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DMXQT_ENABLE_TESTS=true \
            -DMXQT_MULTIPLIER_VERSION=${{ inputs.multiplier_release }} \
            -Dmultiplier_DIR="${MULTIPLIER_INSTALL_DIRECTORY}/lib/cmake/multiplier" \
            -Dgap_DIR="${MULTIPLIER_INSTALL_DIRECTORY}/lib/cmake/gap" \
            -S . \
            -B build

      - name: Build qt-multiplier
        run: |
          cmake --build build -j $(nproc)

      - name: Install qt-multiplier
        run: |
          cmake --install build

      - name: Bundle multiplier
        run: |
          # Copy the entire multiplier release into the bundle.
          # This includes: binaries (mx-*), shared libraries, Python
          # bindings, CMake config files, headers, and gap.
          cp -a "${MULTIPLIER_INSTALL_DIRECTORY}"/bin/* "${INSTALL_DIR}/bin/"
          cp -a "${MULTIPLIER_INSTALL_DIRECTORY}"/lib/* "${INSTALL_DIR}/lib/"

          # Preserve include and cmake directories for development use
          if [ -d "${MULTIPLIER_INSTALL_DIRECTORY}/include" ]; then
            cp -a "${MULTIPLIER_INSTALL_DIRECTORY}/include" "${INSTALL_DIR}/"
          fi

      - name: Bundle Qt libraries
        run: |
          qt_lib_dir="/usr/lib/x86_64-linux-gnu"

          # Core Qt shared libraries needed at runtime
          qt_libs=(
            libQt6Core
            libQt6Gui
            libQt6Widgets
            libQt6Concurrent
            libQt6Core5Compat
            libQt6DBus
            libQt6OpenGL
            libQt6OpenGLWidgets
            libQt6Network
            libQt6XcbQpa
            libQt6Test
          )

          for lib in "${qt_libs[@]}"; do
            cp -a "${qt_lib_dir}/${lib}".so* "${INSTALL_DIR}/lib/" 2>/dev/null || true
          done

          # ICU libraries (Qt runtime dependency)
          cp -a "${qt_lib_dir}"/libicu*.so* "${INSTALL_DIR}/lib/" 2>/dev/null || true

          # Qt platform and image format plugins
          qt_plugin_dir="/usr/lib/x86_64-linux-gnu/qt6/plugins"
          mkdir -p "${INSTALL_DIR}/plugins"
          for plugin_type in platforms imageformats platforminputcontexts xcbglintegrations; do
            if [ -d "${qt_plugin_dir}/${plugin_type}" ]; then
              cp -a "${qt_plugin_dir}/${plugin_type}" "${INSTALL_DIR}/plugins/"
            fi
          done

          # qt.conf tells Qt where to find plugins relative to the binary.
          # Works for both /usr/local (DEB) and custom extract locations (tar.xz).
          printf '[Paths]\nPrefix = ..\nPlugins = plugins\nLibraries = lib\n' \
            > "${INSTALL_DIR}/bin/qt.conf"

      - name: Build DEB package
        id: deb_package
        run: |
          cmake \
            -S package \
            -B package-build \
            -DBUNDLE_DIR="${INSTALL_DIR}" \
            -DCPACK_GENERATOR=DEB

          cmake --build package-build --target package

          deb_path="$(ls package-build/*.deb)"
          deb_name="$(basename "${deb_path}")"

          echo "PATH=${deb_path}" >> $GITHUB_OUTPUT
          echo "NAME=${deb_name}" >> $GITHUB_OUTPUT

      - name: Create portable archive
        id: archive
        run: |
          archive_name="qt-multiplier-${{ inputs.multiplier_release }}-${{ inputs.platform }}.tar.xz"
          tar -cJf "${archive_name}" \
            --transform 's/^qt-multiplier-install/multiplier/' \
            -C "${{ github.workspace }}" qt-multiplier-install
          echo "PATH=${archive_name}" >> $GITHUB_OUTPUT
          echo "NAME=${archive_name}" >> $GITHUB_OUTPUT

      - name: Upload DEB package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.deb_package.outputs.NAME }}
          path: ${{ steps.deb_package.outputs.PATH }}

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.NAME }}
          path: ${{ steps.archive.outputs.PATH }}

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="$(git rev-parse --short=7 HEAD)"

          deb_name="${{ steps.deb_package.outputs.NAME }}"
          tar_name="${{ steps.archive.outputs.NAME }}"
          mx_rel="${{ inputs.multiplier_release }}"
          mx_url="https://github.com/trailofbits/multiplier/releases/tag/${mx_rel}"

          notes="Built against [multiplier ${mx_rel}](${mx_url})"
          notes="${notes}

          ## Install

          **Ubuntu 24.04 (DEB):**
          \`\`\`bash
          sudo apt install ./${deb_name}
          sudo ldconfig
          \`\`\`

          **Portable (any Linux):**
          \`\`\`bash
          tar -xf ${tar_name}
          export PATH=\"\$(pwd)/multiplier/bin:\$PATH\"
          export LD_LIBRARY_PATH=\"\$(pwd)/multiplier/lib:\$LD_LIBRARY_PATH\"
          \`\`\`"

          gh release create "${release_tag}" \
            "${{ steps.deb_package.outputs.PATH }}" \
            "${{ steps.archive.outputs.PATH }}" \
            --repo "${{ github.repository }}" \
            --title "qt-multiplier ${release_tag}" \
            --notes "${notes}" \
            --latest
